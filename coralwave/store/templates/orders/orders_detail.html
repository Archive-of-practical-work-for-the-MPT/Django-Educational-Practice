{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали заказа</title>
    <link rel="stylesheet" href="{% static 'css/info.css' %}">
</head>
<body>
    <header>
        <h1>Детали заказа</h1>
        <nav>
            <a href="{% url 'info_view' %}">Главная</a>
            <a href="{% url 'orders_list' %}">Список заказов</a>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Заказ: #{{ object.pk }}</h2>
            <p>ID Заказа: {{ object.pk }}</p>
            <p>Пользователь: {{ object.user }}</p>
            <p>Статус: {{ object.status }}</p>
            <a href="{% url 'orders_update' object.pk %}" class="btn-back">Редактировать</a>
            <a href="{% url 'orders_delete' object.pk %}" class="btn-back">Удалить</a>
            <a href="{% url 'orders_list' %}" class="btn-back">Назад к списку</a>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 CoralWave</p>
    </footer>
</body>
</html>
