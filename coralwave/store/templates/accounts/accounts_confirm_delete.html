{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение удаления аккаунта</title>
    <link rel="stylesheet" href="{% static 'css/info.css' %}">
</head>
<body>
    <header>
        <h1>Подтверждение удаления аккаунта</h1>
        <nav>
            <a href="{% url 'info_view' %}">Главная</a>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Удалить аккаунт</h2>
            <p>Вы уверены, что хотите удалить "{{ object }}"?</p>
            <form method="post">
                {% csrf_token %}
                <input type="submit" value="Подтвердить" />
                <a href="{% url 'account_list' %}">Отмена</a>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 CoralWave</p>
    </footer>
</body>
</html>
