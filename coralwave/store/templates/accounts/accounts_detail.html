{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали аккаунта</title>
    <link rel="stylesheet" href="{% static 'css/info.css' %}">
</head>
<body>
    <header>
        <h1>Детали аккаунта</h1>
        <nav>
            <a href="{% url 'info_view' %}">Главная</a>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Аккаунт: {{ object.username }}</h2>
            <p>Имя пользователя: {{ object.username }}</p>
            <p>Email: {{ object.email }}</p>
            <a href="{% url 'accounts_update' object.pk %}" class="btn-back">Редактировать</a>
            <a href="{% url 'accounts_delete' object.pk %}" class="btn-back">Удалить</a>
            <a href="{% url 'accounts_list' %}" class="btn-back">Назад к списку</a>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 CoralWave</p>
    </footer>
</body>
</html>
